<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cancel It</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="popup-brand">
          <img src="assets/in-app/logo-mark.png" width="22" height="22" alt="">
          <span class="popup-title">Cancel It</span>
        </div>
        <button id="popup-toggle" class="switch small" type="button" role="switch" aria-checked="true" aria-label="Filtering on or off"><span class="knob"></span></button>
      </header>

      <section id="popup-locked" class="popup-locked hidden" aria-label="Popup locked">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E7A6B" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <h1 class="popup-locked-title">Locked</h1>
        <p class="popup-locked-copy">Filtering is still running. Enter the family PIN to see details or change anything.</p>
        <input id="popup-pin" type="password" inputmode="numeric" maxlength="8" aria-label="Family PIN" autocomplete="off">
        <p id="popup-pin-error" class="field-error hidden" role="alert"></p>
        <button id="popup-unlock" class="button-primary" type="button">Unlock</button>
      </section>

      <section id="popup-main" class="popup-main">
        <div id="popup-hero" class="popup-hero">
          <div class="popup-hero-head">
            <span id="popup-dot" class="popup-dot" aria-hidden="true"></span>
            <span id="popup-headline" class="popup-headline">Filtering is on</span>
          </div>
          <p id="popup-sub" class="popup-sub">Watching for your blocklist.</p>
        </div>

        <div id="popup-site-row" class="popup-site-row">
          <span class="popup-site-label">This page</span>
          <span id="popup-site" class="popup-site-value">—</span>
        </div>

        <div id="popup-blocks" class="popup-blocks hidden">
          <p id="popup-count" class="popup-count">0 items filtered on this page</p>
          <div id="popup-chips" class="popup-chips"></div>
        </div>

        <button id="open-options" class="popup-settings-button" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6A7 7 0 0 0 19 12z"></path></svg>
          Open settings
        </button>
      </section>

      <footer class="popup-footer">
        <span class="popup-footnote">Nothing is uploaded.</span>
        <span class="popup-footer-links">
          <a id="rate-link" href="https://chrome.google.com/webstore" target="_blank" rel="noreferrer noopener">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.7 6.3.8-4.6 4.3 1.2 6.2-5.6-3-5.6 3 1.2-6.2L3 9.5l6.3-.8L12 3z"></path></svg>
            Rate us
          </a>
          <button id="support-link" type="button" class="popup-support-link">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="#D9A514" stroke="#D9A514" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-5-3.5-9-6.5-9-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.5-4 7.5-9 11z"></path></svg>
            Support us
          </button>
        </span>
      </footer>
    </main>
    <script src="firebase-config.js"></script>
    <script src="analytics.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
